name: Check CruiseMapper public position source
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */3 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect permitted public page for ship coordinates
        run: python scripts/cruisemapper_probe.py
