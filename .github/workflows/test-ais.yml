name: Test Quantum AIS receiver
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out isolated tracking development branch
        uses: actions/checkout@v4
        with:
          ref: feature/automatic-ship-tracking
      - name: Confirm tracking code version
        run: |
          echo "Tracking branch commit:"
          git rev-parse --short HEAD
          echo "Diagnostic lines in receiver:"
          grep -n 'AIS messages received\|AIS WebSocket connected' scripts/ais_receiver.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'websockets>=13,<16'
      - name: Receive actual AIS reports (up to four minutes)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python -u scripts/ais_receiver.py
      - name: Report results without publishing or changing live app
        run: |
          if [ -f ship-position.json ]; then
            echo "A verified AIS position file is available:"
            python -c 'import json; p=json.load(open("ship-position.json")); print("MMSI:",p["mmsi"],"Reported at:",p["reportedAt"],"Lat:",p["lat"],"Lon:",p["lon"])'
          else
            echo "No verified position received during this test window."
          fi
