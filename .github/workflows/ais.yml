name: Update Quantum AIS position
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quantum-ais-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'websockets>=13,<16'
      - name: Listen for real AIS reports
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python scripts/ais_receiver.py
      - name: Check MyShipTracking fallback
        if: always()
        env:
          MYSHIPTRACKING_API_KEY: ${{ secrets.MYSHIPTRACKING_API_KEY }}
        run: python scripts/myshiptracking_fallback.py
      - name: Check authorised CruiseMapper public AIS position
        if: always()
        run: python scripts/cruisemapper_position.py
      - name: Commit only new verified reports
        run: |
          if [ ! -f ship-position.json ]; then
            echo "No position file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Preserve our newly received report while updating the checkout.
          cp ship-position.json "$RUNNER_TEMP/ship-position-candidate.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Do not replace an equal or newer verified AIS report.
            python - <<'PY'
import json
from datetime import datetime, timezone
from pathlib import Path

candidate = Path(__import__('os').environ['RUNNER_TEMP']) / 'ship-position-candidate.json'
current = Path('ship-position.json')
def reported(path):
    try:
        data = json.loads(path.read_text())
        value = data.get('timestamp') or data.get('reportedAt')
        return datetime.fromisoformat(value.replace('Z', '+00:00')) if value else datetime.min.replace(tzinfo=timezone.utc)
    except (OSError, ValueError, TypeError, AttributeError):
        return datetime.min.replace(tzinfo=timezone.utc)
if reported(candidate) > reported(current):
    current.write_bytes(candidate.read_bytes())
    print('Applying newer verified AIS report.')
else:
    print('Latest repository AIS report is as new or newer; preserving it.')
PY
            if git diff --quiet -- ship-position.json && [ -n "$(git ls-files ship-position.json)" ]; then
              echo "No newer AIS position to commit."
              exit 0
            fi
            git add ship-position.json
            git commit -m "Update verified Quantum AIS position"
            if git push origin HEAD:main; then
              echo "Verified AIS position published."
              exit 0
            fi
            echo "Repository changed during push; retrying ($attempt/3)."
            sleep 2
          done
          echo "Repository changed repeatedly; a later scheduled run will retry."
          exit 0
